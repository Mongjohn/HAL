<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAL Dashboard Editor</title>
  <link rel="stylesheet" href="/editor.css">
  <script src="/editor.js" defer></script>
</head>
<body>
  <header>
    <h1>HAL Dashboard Editor</h1>
    <div class="controls">
      <button id="undo" disabled>Undo</button>
      <button id="restore" disabled>Restore previous layout</button>
      <button id="apply" class="primary" disabled>Apply to TV</button>
    </div>
  </header>
  <p id="status" role="status">Loading dashboard…</p>
  <main id="workspace" hidden>
    <section class="preview" aria-label="Dashboard preview">
      <div class="controls">
        <label>Surface <select id="surface"><option value="assistant">Assistant tab</option><option value="home">Home panel</option></select></label>
        <label>View <select id="page"></select></label>
        <button id="add-page">Add view</button>
        <button id="remove-page">Remove view</button>
      </div>
      <div class="controls">
        <label>View title <input id="page-title" maxlength="160"></label>
        <label>Columns <input id="columns" type="number" min="1" max="6"></label>
        <label id="dock-label"><input id="dock" type="checkbox"> Show dock</label>
        <button id="add-card">Add card</button>
      </div>
      <div class="controls">
        <label>Home Assistant template <select id="template"></select></label>
        <button id="use-template" disabled>Use template</button>
      </div>
      <div class="screen">
        <div id="camera" hidden>Camera</div>
        <div id="grid" aria-label="Card grid"></div>
      </div>
      <p class="hint">Drag a card by its title to move or swap it. Resize it from the lower-right corner.</p>
    </section>
    <aside id="inspector" hidden aria-label="Card settings">
      <h2>Card settings</h2>
      <label>Title <input id="title" maxlength="160"></label>
      <div id="dimensions">
        <label>Column <input id="x" type="number" min="1"></label>
        <label>Row <input id="y" type="number" min="1"></label>
        <label>Width <input id="w" type="number" min="1"></label>
        <label>Height <input id="h" type="number" min="1" max="30"></label>
      </div>
      <label><input id="pair" type="checkbox"> Two readings per row</label>
      <div class="controls">
        <button id="duplicate">Duplicate</button>
        <button id="remove">Remove card</button>
      </div>
      <h2>Card contents</h2>
      <ol id="contents"></ol>
      <h2>Add an entity</h2>
      <label>Search <input id="search" type="search" placeholder="Name or entity ID"></label>
      <div class="controls">
        <label>Room <select id="room"></select></label>
        <label>Type <select id="domain"></select></label>
      </div>
      <ul id="entities"></ul>
      <label>Entity ID <input id="manual" maxlength="255" placeholder="sensor.living_room_temperature"></label>
      <div class="controls">
        <label>Display <select id="display"><option value="entity">Reading or action</option><option value="gauge">Gauge</option><option value="history">History</option></select></label>
        <button id="add-entity">Add</button>
      </div>
      <div id="gauge-fields" class="controls" hidden>
        <label>Minimum <input id="gauge-min" type="number" value="0"></label>
        <label>Maximum <input id="gauge-max" type="number" value="100"></label>
      </div>
      <label id="history-fields" hidden>History hours <input id="history-hours" type="number" min="1" max="8760" value="24"></label>
    </aside>
  </main>
</body>
</html>
